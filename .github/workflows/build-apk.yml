# Workflow reutilizable: compila el APK de client o manager con Buildozer.
name: build-apk

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      retention-days:
        required: false
        type: number
        default: 30

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libltdl-dev python3-pip
          pip install --user --upgrade Cython buildozer "virtualenv==20.21.0" setuptools
      - name: Preparar la app
        run: python3 tools/stage_android.py ${{ inputs.app }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            build/android/${{ inputs.app }}/.buildozer
          key: buildozer-${{ inputs.app }}-${{ hashFiles('*/buildozer.spec') }}
      - name: Compilar
        working-directory: build/android/${{ inputs.app }}
        env:
          PIP_NO_BINARY: "charset-normalizer,chardet"
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-apk
          path: build/android/${{ inputs.app }}/bin/*.apk
          retention-days: ${{ inputs.retention-days }}
