# Recetario (app pública): tests + APK. Con una etiqueta v* publica el APK como Release.
name: Recetario APK

on:
  push:
    branches: [ "main", "_dev" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write   # para crear la Release en las etiquetas

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v

  build:
    needs: tests
    uses: ./.github/workflows/build-apk.yml
    with:
      app: client

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
