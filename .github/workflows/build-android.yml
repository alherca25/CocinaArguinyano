name: Build Android APKs

on:
  push:
    branches: [ "main", "_dev" ]
  workflow_dispatch:

jobs:
  build-interface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Interface Build
        run: |
          cp src/MvInterface.py main.py
          cp buildozer_interface.spec buildozer.spec

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1.1.2
        id: buildozer-interface
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: Upload Interface APK
        uses: actions/upload-artifact@v3
        with:
          name: Recetario_APK
          path: bin/*.apk

  build-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Prepare Manager Build
        run: |
          cp src/MvRecipeManager.py main.py
          cp buildozer_manager.spec buildozer.spec

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1.1.2
        id: buildozer-manager
        with:
          command: buildozer android debug
          buildozer_version: master

      - name: Upload Manager APK
        uses: actions/upload-artifact@v3
        with:
          name: RecipeManager_APK
          path: bin/*.apk
