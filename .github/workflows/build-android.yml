name: Build Android APKs

on:
  push:
    branches: [ "main", "_dev" ]
  workflow_dispatch:

jobs:
  build-interface:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Interface Build
        run: |
          cp src/MvInterface.py main.py
          cp buildozer_interface.spec buildozer.spec

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev python3-pip zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
          pip install --upgrade Cython buildozer "virtualenv==20.21.0"
          
      - name: Clean stale buildozer cache
        run: rm -rf .buildozer/android/platform/build-* || true

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload Interface APK
        uses: actions/upload-artifact@v4
        with:
          name: Recetario_APK
          path: bin/*.apk

  build-manager:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Manager Build
        run: |
          cp src/MvRecipeManager.py main.py
          cp buildozer_manager.spec buildozer.spec

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev python3-pip zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
          pip install --upgrade Cython buildozer "virtualenv==20.21.0"
          
      - name: Clean stale buildozer cache
        run: rm -rf .buildozer/android/platform/build-* || true

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: RecipeManager_APK
          path: bin/*.apk
