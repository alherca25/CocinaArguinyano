name: Build Android APKs

on:
  push:
    branches: [ "main", "_dev" ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (lógica sin interfaz)
        run: python -m unittest discover -s tests -v

  build:
    needs: tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: interface
            artifact: Recetario_APK
          - app: manager
            artifact: GestorRecetas_APK
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev libltdl-dev python3-pip
          pip install --upgrade Cython buildozer "virtualenv==20.21.0" setuptools

      - name: Stage app
        run: python3 tools/stage_android.py ${{ matrix.app }}

      # Caché del SDK/NDK y de la compilación; se invalida al cambiar el .spec.
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android_build/${{ matrix.app }}/.buildozer
          key: buildozer-${{ matrix.app }}-${{ hashFiles('buildozer_*.spec') }}

      - name: Build with Buildozer
        working-directory: android_build/${{ matrix.app }}
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: android_build/${{ matrix.app }}/bin/*.apk
